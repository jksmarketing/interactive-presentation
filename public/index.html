<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>JKS Events</title><style>
*{box-sizing:border-box}body{margin:0;background:#111317;color:#eee;font:15px system-ui,sans-serif}main{max-width:1450px;margin:auto;padding:24px}h1,h2,h3,p{margin:0 0 14px}h1{font-size:26px}h2{font-size:19px}a{color:#efad65}button,input,select,textarea{font:inherit;color:inherit;background:#252932;border:1px solid #424750;border-radius:7px;padding:10px}button{cursor:pointer}button:hover{border-color:#edab60}button.primary{background:#e79843;color:#17110a;border-color:#e79843;font-weight:700}button:disabled{opacity:.4;cursor:default}input,select,textarea{width:100%}label{display:block;color:#b9bec7;font-size:13px;margin:9px 0}label input,label select,label textarea{display:block;margin-top:5px}header,.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}header{justify-content:space-between;margin-bottom:24px}nav{display:flex;gap:15px;flex-wrap:wrap}.panel{background:#1c2027;border:1px solid #343944;border-radius:12px;padding:18px;margin-bottom:15px}.editor{display:grid;grid-template-columns:220px 1fr 280px;gap:14px}.thumb{width:100%;text-align:left;margin-bottom:6px}.selected{border-color:#efad65;color:#efad65}.slide{aspect-ratio:16/9;position:relative;overflow:hidden;background-size:cover;background-position:center;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:5%;container-type:inline-size}.slide h2{font-family:Georgia,serif;font-size:var(--title-size,5cqw);line-height:1.1;white-space:pre-wrap;overflow-wrap:anywhere;max-width:100%}.slide p{font-size:2.5cqw;white-space:pre-wrap;max-width:100%}.slide img{position:absolute;top:5%;right:5%;max-width:19%;max-height:17%;object-fit:contain}.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.tv main{padding:0;max-width:none;width:100vw;height:100vh;display:grid;place-items:center;background:#000}.tv .slide{width:min(100vw,177.7778vh);height:min(100vh,56.25vw)}.overlay{position:absolute;bottom:4%;font-size:5cqw;background:#0009;padding:8px 20px;border-rad .editor{grid-template-columns: minmax(180px,220px) minmax(0,1fr) minmax(240px,280px);align-items:start}.editor .panel{min-width:0}.editor .slide{border-radius:6px}.editor textarea{resize:vertical;min-height:62px}nav a{text-decoration:none;padding:8px 10px;border-radius:6px}nav a:hover{background:#252932}button:focus-visible,a:focus-visible{outline:2px solid #efad65;outline-offset:2px}input[type=color]{height:42px;padding:4px}.editor + .panel{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.editor + .panel h2,.editor + .panel .row{grid-column:1/-1}.editor + .panel label{margin:0}@media(max-width:950px){.editor{grid-template-columns:1fr}}


.phone-preview-header{display:flex;align-items:center;gap:12px;justify-content:space-between;margin:24px 0 12px}.phone-preview-header select{width:auto}.phone-preview-header h2{margin:0}.phone-frame{width:min(100%,310px);margin:auto;border:7px solid #08090b;border-radius:30px;overflow:hidden;box-shadow:0 8px 30px #0005}.phone-screen{background-color:#34271d;background-size:cover;background-position:center;position:relative;isolation:isolate;display:flex;flex-direction:column;align-items:center;justify-content:space-between;min-height:540px;padding:26px 18px;text-align:center}.phone-screen:before{content:'';position:absolute;inset:0;background:linear-gradient(#0005,#0008);z-index:-1}.phone-brand{font-weight:700;font-size:18px;min-height:55px;display:grid;place-items:center}.phone-brand img{max-width:150px;max-height:75px;object-fit:contain}.phone-content{width:100%;margin:auto 0;padding:22px 12px;border-radius:16px;background:#15100c88;backdrop-filter:blur(5px);overflow-wrap:anywhere}.phone-content h2{font-size:23px;line-height:1.15}.phone-content h3{font-size:17px}.phone-timer{font-size:46px;font-variant-numeric:tabular-nums;font-weight:700;margin:12px 0}.phone-stars{display:flex;justify-content:center;gap:4px;margin:14px 0;color:#f6c56a;font-size:26px}.phone-stars button{font-size:26px;padding:4px;background:transparent;border:0;color:inherit;min-width:32px}.phone-submit,.phone-content button.primary{display:block;width:100%;padding:12px;background:#e79843;color:#17110a;font-weight:700;border-radius:8px}.audience main{max-width:520px;padding:0;min-height:100dvh}.audience .phone-screen{min-height:100dvh;padding:30px 20px}.audience{background:#34271d}hr{border:0;border-top:1px solid #424750;margin:20px 0}
.qr-slide{padding:3%;gap:1cqw;align-items:center!important;text-align:center!important}.qr-slide h2{font-size:min(var(--title-size),5cqw);margin:0}.qr-slide p{font-size:2.3cqw;margin:0}.join-qr{width:26%;max-height:55%;aspect-ratio:1;flex-shrink:0;background:white}.join-qr svg{display:block;width:100%;height:100%}.join-url{font-size:1.65cqw;overflow-wrap:anywhere;max-width:95%;background:#0009;padding:.5cqw 1cqw;border-radius:4px;color:white}
.type-help{background:#e7984312;border:1px solid #e7984355;border-radius:8px;padding:12px;margin:12px 0;color:#efad65;font-size:13px}.type-help p{margin:6px 0 0;color:#c4c8cf;line-height:1.5}.preview-interaction{position:absolute;bottom:3%;left:50%;transform:translateX(-50%);background:#000b;border-radius:8px;padding:1cqw 3cqw;text-align:center;white-space:nowrap;color:inherit}.preview-interaction strong{display:block;font-size:4cqw;line-height:1.15}.preview-interaction small{display:block;font-size:1.5cqw;margin-top:.4cqw}
.slide-copy{position:absolute;left:var(--text-x);top:var(--text-y);width:var(--text-width);transform:translate(-50%,-50%);text-align:var(--text-align);font-family:var(--slide-font);z-index:1}.slide .slide-copy h2{font-family:inherit;font-size:var(--title-size);margin:0 0 1.2cqw}.slide .slide-copy p{font-size:var(--sub-size);margin:0}.slide img{left:var(--logo-x);top:var(--logo-y);right:auto;width:var(--logo-width);max-width:none;max-height:none;height:auto;transform:translate(-50%,-50%);z-index:2}.qr-slide .join-qr{position:absolute;top:32%;left:50%;transform:translateX(-50%);width:24%;max-height:54%}.qr-slide .join-url{position:absolute;bottom:3%;left:50%;transform:translateX(-50%);width:max-content}.overlay,.preview-interaction{z-index:3}.phone-screen{font-family:var(--mobile-font);justify-content:center;display:grid;grid-template-rows:minmax(0,var(--mobile-y)) auto minmax(0,var(--mobile-bottom));justify-items:center;align-items:center}.phone-brand{position:absolute;left:var(--mobile-logo-x);top:var(--mobile-logo-y);transform:translate(-50%,-50%);width:var(--mobile-logo-width);min-height:0;z-index:2}.phone-brand img{width:100%;max-width:none;max-height:none;height:auto}.phone-content{grid-row:2;width:var(--mobile-width);margin:0;text-align:var(--mobile-align);font-size:var(--mobile-text)}.phone-content h2{font-size:var(--mobile-title)}.phone-content h3{font-size:1.1em}.phone-stars{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;color:inherit}.phone-stars button,.phone-stars span{display:grid;place-items:center;min-width:0;font-size:clamp(12px,3.6vw,17px);padding:8px 0;border:1px solid #ffffff66;border-radius:6px;background:#0005;color:inherit}.phone-stars .chosen{background:#e79843;color:#17110a;border-color:#e79843;font-weight:700}.editor details{border-top:1px solid #424750;margin:14px 0;padding-top:10px}.editor summary{cursor:pointer;font-weight:600}.editor output{float:right;color:#efad65}.editor input[type=range]{padding:0}.phone-frame .phone-screen{height:540px;min-height:540px}.audience .phone-screen{height:100dvh;min-height:100dvh;grid-template-rows:minmax(0,var(--mobile-y)) auto minmax(0,var(--mobile-bottom));overflow:auto}.phone-content{max-height:none}.phone-screen .phone-brand{pointer-events:none}
</style></head><body><main id="app"></main><script type="module" src="/app.js"></script></body></html>
